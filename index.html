<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="stylesheet" href="https://fixsarts.github.io/header/header.css">
<div id="fa-header-root"></div>
<script src="https://fixsarts.github.io/header/header.js"></script>

  <link rel="stylesheet"
    href="https://fixsarts.github.io/footer/css/footer.css">
  <style>
  footer[data-site-footer] {
    --ft-bg: #0A0A0D;}
</style>
              
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abis Invoice Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f8;--card:#fff;--tx:#14161c;--mut:#6b7280;--bd:#d9dce3;--pri:#1a2f9e;--on:#fff;--acc:#f5d300;--red:#d4141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mut:#9aa1ad;--bd:#2c313b;--pri:#7d8fff;--on:#0f1115;--red:#ff6b70}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--mut:#9aa1ad;--bd:#2c313b;--pri:#7d8fff;--on:#0f1115;--red:#ff6b70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h1 span{background:var(--acc);color:#14161c;padding:2px 8px;border-radius:6px;font-style:italic;font-weight:800}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--pri);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px dashed var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;position:relative}
.item .row{margin-top:8px}
.x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--red);font-size:20px;line-height:1;padding:4px 8px}
.sub{font-size:12px;color:var(--mut);margin-top:6px;text-align:right}
button.add{width:100%;padding:11px;border-radius:10px;border:1px dashed var(--pri);background:none;color:var(--pri);font-size:15px;font-weight:600}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum .t{font-size:20px;font-weight:800;color:var(--red);border-top:1px solid var(--bd);margin-top:4px;padding-top:10px}
button.go{width:100%;padding:15px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-size:17px;font-weight:700}
#msg{text-align:center;font-size:13px;color:var(--mut);margin:10px 0 24px;min-height:18px}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ih+label{margin-top:0}
.ih .x{position:static;margin-left:auto}
.ih .no{font-size:13px}
.grip{touch-action:none;cursor:grab;font-size:22px;line-height:1;padding:6px 10px;user-select:none;-webkit-user-select:none;color:var(--mut);border-radius:8px;background:var(--bg)}
.item.drag{box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:.93;border-style:solid;border-color:var(--pri);background:var(--card);z-index:5}
.hint{font-size:12px;color:var(--mut);margin:0 0 10px}
.banner{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--pri);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner[hidden],.toast[hidden]{display:none}
.banner button{margin-left:auto;white-space:nowrap;padding:8px 12px;border-radius:9px;border:0;background:var(--pri);color:var(--on);font-size:13px;font-weight:700}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hh span{font-size:12px;color:var(--mut)}
.he{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}
.hm{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.hm .tt{color:var(--red);font-weight:700;white-space:nowrap}
.hs{font-size:12px;color:var(--mut);margin:4px 0 8px}
.hb{display:flex;gap:8px;flex-wrap:wrap}
.sm{padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;font-weight:600}
.sm.d{color:var(--red)}
.sm.arm,.warn.arm{background:var(--red);color:#fff;border-color:var(--red)}
.warn{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--red);background:none;color:var(--red);font-size:14px;font-weight:600}
.empty{font-size:13px;color:var(--mut);text-align:center;padding:14px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#14161c;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-i[...]
</style>
  
</head>
<body>
<div class="wrap">
<h1><span>Abis</span> Invoice Generator</h1>
<div class="banner" id="banner" hidden><span id="bannerTx"></span><button type="button" id="newBtn">Nota Baru</button></div>
<div class="card">
  <label>Nama Costumer</label>
  <input id="cust" placeholder="Nama Costumer" autocomplete="off">
  <div class="row">
    <div><label>Date Ordering</label><input id="dOrder" type="date"></div>
    <div><label>Invoice Date</label><input id="dInv" type="date"></div>
  </div>
  <label>No. Invoice</label>
  <input id="inv" autocomplete="off">
</div>
<div class="card">
  <p class="hint">Tahan ikon ⠿ lalu geser untuk mengubah urutan item.</p>
  <div id="items"></div>
  <button class="add" id="addBtn" type="button">+ Tambah Item</button>
</div>
<div class="card">
  <label>DP (Rp) — kosongkan jika belum ada</label>
  <input id="dp" type="number" inputmode="numeric" placeholder="0">
</div>
<div class="card sum">
  <div><span>Grand Total</span><b id="sTotal">Rp.0</b></div>
  <div><span>DP</span><b id="sDp">Rp.0</b></div>
  <div class="t"><span>Sisa Pembayaran</span><span id="sSisa">Rp.0</span></div>
</div>
<button class="go" id="go" type="button">Buat &amp; Download PDF</button>
<div id="msg"></div>

<div class="card">
  <div class="hh"><b>Riwayat Nota</b><span id="hCount"></span></div>
  <input id="hSearch" placeholder="Cari nama atau no. invoice" autocomplete="off">
  <div id="hList"></div>
</div>
<div class="card">
  <b>Pengaturan Data</b>
  <p class="hint" style="margin-top:6px">Riwayat tersimpan di browser HP ini saja. Hapus kalau sudah tidak diperlukan.</p>
  <button class="warn" id="clrHist" type="button">Hapus Semua Riwayat</button>
  <button class="warn" id="clrAll" type="button">Reset Total (riwayat + nomor urut)</button>
</div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const FONTS={R:"AAEAAAAOAIAAAwBgRFNJRwAAAAEAAnI0AAAACEdERUYJFgkZAAI1IAAAAEBHUE9TG3YznQACNWAAABUUR1NVQu6BBt0AAkp0AAAnwE9TLzLZ63ftAAABaAAAAGBjbWFwkuicugAAElgAAAT4Z2x5ZvpM9EcAAB+cAAHtUGhlYWQaySRhAAA[...]
const A={"name": 142.0, "date": 380.0, "inv": 379.0, "desc": 141.0, "qty": 870.0, "up": 1249.5, "tot": 1498.0, "idate": 140.0, "grand": 1506.9, "dp": 1455.1, "sisa": 1454.9};
const $=id=>document.getElementById(id);
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const num=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp=n=>'Rp.'+num(n);
const qfmt=q=>String(q).replace('.',',');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);return HARI[dt.getDay()]+', '+String(d).padStart(2,'0')+' '+BULAN[m-1]+' '+y;}
const HK='abis_history',CK='abis_inv_counter',MAXROWS=12,MAXHIST=100;
let counter=1,editingId=null;
try{counter=parseInt(localStorage.getItem(CK)||'1',10)||1;}catch(e){}
const loadHist=()=>{try{const a=JSON.parse(localStorage.getItem(HK)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];} };
const saveHist=a=>{try{localStorage.setItem(HK,JSON.stringify(a));return true;}catch(e){return false;}};
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true;},2800);}
function confirmTap(btn,armedText,fn){
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('arm')){clearTimeout(btn._t);btn.classList.remove('arm');btn.textContent=btn.dataset.t;fn();return;}
    btn.dataset.t=btn.textContent;btn.classList.add('arm');btn.textContent=armedText;
    btn._t=setTimeout(()=>{btn.classList.remove('arm');btn.textContent=btn.dataset.t;},3500);
  });
}

/* ---------- form ---------- */
function makeInv(){
  if(editingId)return;
  const s=$('dOrder').value;if(!s)return;
  const [y,m,d]=s.split('-');$('inv').value='ABS/'+d+m+y.slice(2)+'/'+String(counter).padStart(3,'0');
}
$('dOrder').addEventListener('change',makeInv);
function renumber(){document.querySelectorAll('.item').forEach((e,i)=>{e.querySelector('.no').textContent='Item '+(i+1);});}
function addItem(v){
  v=v||{};
  const el=document.createElement('div');el.className='item';
  el.innerHTML='<div class="ih"><span class="grip" title="Tahan lalu geser">⠿</span><b class="no"></b><button class="x" type="button" aria-label="Hapus">×</button></div>'+
  '<label>Deskripsi</label><input class="d" placeholder="Spanduk 6*2" autocomplete="off">'+
  '<div class="row"><div><label>Qty</label><input class="q" type="number" inputmode="decimal" placeholder="1"></div>'+
  '<div><label>Satuan (boleh kosong)</label><input class="u" autocomplete="off"></div></div>'+
  '<label>Harga satuan (Rp)</label><input class="p" type="number" inputmode="numeric" placeholder="240000">'+
  '<div class="sub">Total item: <b class="st">Rp.0</b></div>';
  el.querySelector('.d').value=v.d||'';
  el.querySelector('.q').value=v.q!=null?v.q:'';
  el.querySelector('.u').value=v.u!==undefined?v.u:'Pcs';
  el.querySelector('.p').value=v.p||'';
  el.querySelector('.x').onclick=()=>{if(document.querySelectorAll('.item').length>1){el.remove();calc();}};
  el.querySelector('.grip').addEventListener('pointerdown',e=>startDrag(e,el));
  el.addEventListener('input',calc);$('items').appendChild(el);calc();
}
function startDrag(e,el){
  e.preventDefault();
  const h=e.currentTarget;
  try{h.setPointerCapture(e.pointerId);}catch(x){}
  el.classList.add('drag');
  const move=ev=>{
    const y=ev.clientY;
    if(y<90)window.scrollBy(0,-14);else if(y>window.innerHeight-90)window.scrollBy(0,14);
    for(const s of [...$('items').children]){
      if(s===el)continue;
      const r=s.getBoundingClientRect();
      if(y<r.top||y>r.bottom)continue;
      const mid=r.top+r.height/2;
      const sAfter=!!(el.compareDocumentPosition(s)&Node.DOCUMENT_POSITION_FOLLOWING);
      if(sAfter&&y>mid)$('items').insertBefore(el,s.nextSibling);
      else if(!sAfter&&y<mid)$('items').insertBefore(el,s);
      break;
    }
  };
  const up=()=>{el.classList.remove('drag');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);calc();};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
}
function getItems(){
  return [...document.querySelectorAll('.item')].map(e=>{
    const qv=parseFloat(e.querySelector('.q').value);
    return {d:e.querySelector('.d').value.trim(),q:isNaN(qv)||qv<=0?1:qv,u:e.querySelector('.u').value.trim(),p:parseFloat(e.querySelector('.p').value)||0,raw:e.querySelector('.d').value.trim()||[...]
  }).filter(i=>i.raw).map(({d,q,u,p})=>({d,q,u,p}));
}
function collect(){
  return {cust:$('cust').value.trim(),dOrder:$('dOrder').value,dInv:$('dInv').value,inv:$('inv').value.trim(),dp:parseFloat($('dp').value)||0,items:getItems()};
}
function totals(d){
  const total=d.items.reduce((s,i)=>s+i.q*i.p,0);
  return {total,dp:d.dp,sisa:Math.max(total-d.dp,0)};
}
function calc(){
  renumber();
  document.querySelectorAll('.item').forEach(e=>{
    const qv=parseFloat(e.querySelector('.q').value),q=isNaN(qv)||qv<=0?1:qv;
    e.querySelector('.st').textContent=rp(q*(parseFloat(e.querySelector('.p').value)||0));
  });
  const t=totals(collect());
  $('sTotal').textContent=rp(t.total);$('sDp').textContent=rp(t.dp);$('sSisa').textContent=rp(t.sisa);
}
$('dp').addEventListener('input',calc);$('addBtn').onclick=()=>addItem();

function setBanner(t){const b=$('banner');if(!t){b.hidden=true;return;}$('bannerTx').textContent=t;b.hidden=false;}
function newNota(){
  editingId=null;
  $('cust').value='';$('dp').value='';
  $('dOrder').value=iso(new Date());$('dInv').value=iso(new Date());
  $('items').innerHTML='';addItem();
  makeInv();setBanner('');$('msg').textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('newBtn').onclick=newNota;

/* ---------- PDF (koordinat dalam px template 1641x2324) ---------- */
const K=595.28/1641;
function buildPDF(data){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:[595.28,841.89]});
  [['R','Poppins-Regular'],['M','Poppins-Medium'],['B','Poppins-Bold']].forEach(([k,n])=>{
    doc.addFileToVFS(n+'.ttf',FONTS[k]);doc.addFont(n+'.ttf',n,'normal');
  });
  doc.addImage(BG,'JPEG',0,0,595.28,841.89);
  const FN={R:'Poppins-Regular',M:'Poppins-Medium',B:'Poppins-Bold'};
  const BLACK=[0,0,0],NAVY=[12,33,86];
  function T(t,x,y,f,size,col,align,maxW){
    if(!t)return;
    doc.setFont(FN[f],'normal');doc.setTextColor(col[0],col[1],col[2]);
    let s=size*K;doc.setFontSize(s);
    if(maxW){while(doc.getTextWidth(t)>maxW*K&&s>size*K*0.55){s-=0.25;doc.setFontSize(s);}}
    doc.text(t,x*K,y*K,{align:align||'left'});
  }
  T(data.cust,A.name,429,'B',49.5,BLACK,'left',930);
  T(fmtDate(data.dOrder),A.date,485,'M',28.8,BLACK,'left',520);
  T(data.inv,A.inv,527,'M',28.8,BLACK,'left',520);
  const items=data.items;const {total,dp,sisa}=totals(data);
  if(items.length>MAXROWS)throw new Error('overflow');
  const BASE=745,PITCH=53.25;
  const last=BASE+(items.length-1)*PITCH+11;
  doc.setFillColor(135,175,255);
  items.forEach((it,i)=>{
    if(i%2===1){
      const top=BASE+i*PITCH-43.25;
      doc.setGState(new doc.GState({opacity:0.1}));
      doc.rect(132*K,top*K,(1508-132)*K,56*K,'F');
      doc.setGState(new doc.GState({opacity:1}));
    }
  });
  doc.setDrawColor(205,207,211);doc.setLineWidth(2.4*K);
  [779,960,1258].forEach(x=>doc.line(x*K,713*K,x*K,last*K));
  items.forEach((it,i)=>{
    const y=BASE+i*PITCH;
    T(it.d,A.desc,y,'R',28.2,BLACK,'left',600);
    T('x'+qfmt(it.q)+(it.u?' '+it.u:''),A.qty,y,'R',28.2,BLACK,'center',150);
    T(rp(it.p)+',-',A.up,y,'R',28.2,BLACK,'right',270);
    T(rp(it.q*it.p)+',-',A.tot,y,'R',28.2,BLACK,'right',230);
  });
  T(fmtDate(data.dInv),A.idate,1599,'R',42.5,NAVY,'left',600);
  T(rp(total),A.grand,1597,'B',54.4,NAVY,'right',600);
  T(rp(dp),A.dp,1770,'R',31.6,NAVY,'right',320);
  T(rp(sisa),A.sisa,1849,'B',32,NAVY,'right',320);
  return doc;
}
const fileName=d=>{const who=(d.cust||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim();return (who?'Invoice - '+who:'Invoice')+'.pdf';};
async function save(doc,name){
  const buf=doc.output('arraybuffer');let dl=null;
  try{dl=window.claude&&await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:buf});return 'ok';}catch(e){return e&&e.code==='declined'?'declined':'err';}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();return 'ok';
}
async function doDownload(data){
  try{
    const r=await save(buildPDF(data),fileName(data));
    return r;
  }catch(e){console.error(e);return e.message==='overflow'?'overflow':'err';}
}

/* ---------- riwayat ---------- */
function recordHistory(data){
  const h=loadHist(),now=Date.now(),t=totals(data);
  const rec=Object.assign({},data,{total:t.total,upd:now});
  const i=editingId?h.findIndex(x=>x.id===editingId):-1;
  if(i>=0){rec.id=h[i].id;rec.ts=h[i].ts;h[i]=rec;}
  else{
    rec.id=editingId||('n'+now+Math.random().toString(36).slice(2,6));rec.ts=now;h.unshift(rec);
    if(!editingId){counter++;try{localStorage.setItem(CK,String(counter));}catch(e){}}
    editingId=rec.id;
  }
  h.splice(MAXHIST);
  const ok=saveHist(h);renderHist();
  return ok;
}
function fmtTs(ts){try{return new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function openHist(id){
  const e=loadHist().find(x=>x.id===id);if(!e)return;
  editingId=id;
  $('cust').value=e.cust||'';$('dOrder').value=e.dOrder||iso(new Date());$('dInv').value=e.dInv||iso(new Date());
  $('inv').value=e.inv||'';$('dp').value=e.dp?e.dp:'';
  $('items').innerHTML='';(e.items&&e.items.length?e.items:[{}]).forEach(addItem);
  setBanner('Mengedit nota riwayat ('+(e.inv||'-')+'). Download akan memperbarui nota ini.');
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Nota dibuka. Silakan ubah lalu download lagi.');
}
function renderHist(){
  const all=loadHist(),q=$('hSearch').value.trim().toLowerCase();
  const list=all.filter(e=>!q||((e.cust||'')+' '+(e.inv||'')).toLowerCase().includes(q));
  $('hCount').textContent=all.length+' nota';
  const box=$('hList');box.innerHTML='';
  if(!list.length){const p=document.createElement('div');p.className='empty';p.textContent=all.length?'Tidak ada yang cocok.':'Belum ada riwayat. Nota yang di-download akan muncul di sini.';box.appendChild(p);return;}
  list.forEach(e=>{
    const w=document.createElement('div');w.className='he';
    const m=document.createElement('div');m.className='hm';
    const b=document.createElement('b');b.textContent=e.cust||'(tanpa nama)';
    const tt=document.createElement('span');tt.className='tt';tt.textContent=rp(e.total||0);
    m.append(b,tt);
    const s=document.createElement('div');s.className='hs';
    s.textContent=(e.inv||'-')+' · '+(e.items?e.items.length:0)+' item · '+fmtTs(e.upd||e.ts);
    const bar=document.createElement('div');bar.className='hb';
    const o=document.createElement('button');o.type='button';o.className='sm';o.textContent='Buka & Edit';o.onclick=()=>openHist(e.id);
    const d=document.createElement('button');d.type='button';d.className='sm';d.textContent='Download';
    d.onclick=async()=>{const r=await doDownload(e);toast(r==='ok'?'PDF siap: '+fileName(e):r==='declined'?'Download dibatalkan.':r==='overflow'?'Item terlalu banyak.':'Gagal membuat PDF.');};
    const x=document.createElement('button');x.type='button';x.className='sm d';x.textContent='Hapus';
    confirmTap(x,'Yakin? Tap lagi',()=>{saveHist(loadHist().filter(z=>z.id!==e.id));if(editingId===e.id){editingId=null;setBanner('');makeInv();}renderHist();toast('Nota dihapus dari riwayat.');});
    bar.append(o,d,x);w.append(m,s,bar);box.appendChild(w);
  });
}
$('hSearch').addEventListener('input',renderHist);
confirmTap($('clrHist'),'Yakin hapus semua? Tap lagi',()=>{saveHist([]);editingId=null;setBanner('');makeInv();renderHist();toast('Semua riwayat dihapus.');});
confirmTap($('clrAll'),'Yakin reset total? Tap lagi',()=>{
  try{localStorage.removeItem(HK);localStorage.removeItem(CK);}catch(e){}
  counter=1;newNota();renderHist();toast('Reset total selesai. Nomor mulai dari 001.');
});

$('go').onclick=async()=>{
  const m=$('msg'),data=collect();
  if(!data.items.length){m.textContent='Isi minimal 1 item.';return;}
  m.textContent='Membuat PDF...';
  const r=await doDownload(data);
  if(r==='ok'){
    const ok=recordHistory(data);
    m.textContent='PDF siap: '+fileName(data);
    setBanner('Tersimpan di riwayat. Ubah data lalu download lagi untuk memperbarui, atau tekan Nota Baru.');
    if(!ok)toast('Riwayat tidak bisa disimpan di browser ini.');
  }else m.textContent=r==='declined'?'Download dibatalkan.':r==='overflow'?'Item maksimal '+MAXROWS+' baris.':'Gagal membuat PDF, coba lagi.';
};

<!-- Akhir script invoice -->
$('dOrder').value=iso(new Date());
$('dInv').value=iso(new Date());
makeInv();
addItem();
renderHist();
</script>
