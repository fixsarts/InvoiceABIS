<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Abis Invoice Generator</title>

    <link rel="stylesheet" href="https://fixsarts.github.io/header/header.css" />
    <link rel="stylesheet" href="https://fixsarts.github.io/footer/css/footer.css" />
    <style>
      :root {
        --bg: #f3f5f9;
        --card: #ffffff;
        --text: #171a22;
        --muted: #667085;
        --line: #dfe5ee;
        --primary: #1f3bb3;
        --primary-soft: rgba(31, 59, 179, 0.12);
        --accent: #6d5efc;
        --warning: #d73a49;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .wrap {
        max-width: 560px;
        margin: 24px auto 80px;
        padding: 0 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0 6px;
      }

      label:first-child { margin-top: 0; }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f9fafb;
        color: var(--text);
        padding: 11px 12px;
        font-size: 16px;
      }

      input:focus {
        outline: 2px solid rgba(31, 59, 179, 0.25);
        border-color: transparent;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn {
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 16px;
        cursor: pointer;
      }

      .muted {
        color: var(--muted);
      }

      .note {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="fa-header-root"></div>

    <script>
      window.FixsHeaderConfig = {
        mount: '#fa-header-root',
        theme: 'dark',
        homeUrl: './',
        cartUrl: '#cart',
        cartCount: 0,
        links: [
          { label: 'Home', href: '#home' },
          { label: 'Layanan', href: '#layanan' },
          { label: 'Portfolio', href: '#portfolio' },
          { label: 'Tentang', href: '#tentang' },
          { label: 'Tools', children: [
            { label: 'Generator Invoice', href: '#' },
            { label: 'Image to Frame', href: '#' },
            { label: 'Nota', href: '#' }
          ]}
        ]
      };
    </script>
    <script src="https://fixsarts.github.io/header/header.js"></script>

    <main class="wrap">
      <div class="card" id="home">
        <h1 style="margin:0 0 8px; font-size: 26px;">Abis Invoice Generator</h1>
        <p class="muted" style="margin:0;">Header sudah diatur agar muncul di bagian atas halaman.</p>
      </div>

      <div class="card" id="layanan">
        <label>Nama Costumer</label>
        <input type="text" placeholder="Nama Costumer" />

        <div class="row" style="margin-top: 8px;">
          <div>
            <label>Date Ordering</label>
            <input type="date" />
          </div>
          <div>
            <label>Invoice Date</label>
            <input type="date" />
          </div>
        </div>

        <label>No. Invoice</label>
        <input type="text" value="ABS/221026/001" />
      </div>

      <div class="card" id="portfolio">
        <p class="note">Tahan ikon menu lalu geser untuk merapikan item.</p>
        <div class="row">
          <div>
            <label>Qty</label>
            <input type="number" value="1" />
          </div>
          <div>
            <label>Satuan</label>
            <input type="text" value="Pcs" />
          </div>
        </div>
        <label>Deskripsi</label>
        <input type="text" value="Spanduk 6x2" />
        <label>Harga satuan (Rp)</label>
        <input type="number" value="240000" />
      </div>

      <div class="card" id="tentang">
        <button class="btn" type="button">Buat &amp; Download PDF</button>
      </div>
    </main>

    <footer data-site-footer></footer>
    <script src="https://fixsarts.github.io/footer/js/footer-config.js"></script>
    <script src="https://fixsarts.github.io/footer/js/footer.js"></script>
  </body>
</html>
