<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abis Invoice Generator</title>

  <!-- CSS eksternal (header & footer situs) -->
  <link rel="stylesheet" href="https://fixsarts.github.io/Header/header.css">
  <link rel="stylesheet" href="https://fixsarts.github.io/footer/css/footer.css">

  <!-- CSS halaman ini (dimuat paling akhir agar override footer berlaku) -->
  <link rel="stylesheet" href="css/invoice.css">
</head>
<body>

  <!-- Header situs: wadah harus ada di <body>, bukan di <head> -->
  <div id="fa-header-root"></div>
  <div id="abis-header-fallback" hidden>Abis Invoice Generator</div>

  <main class="abis-app" id="abisApp">
    <div class="wrap">
      <h1><span>Abis</span> Invoice Generator</h1>

      <div class="banner" id="banner" hidden>
        <span id="bannerTx"></span>
        <button type="button" id="newBtn">Nota Baru</button>
      </div>

      <!-- Data customer -->
      <div class="card">
        <label for="cust">Nama Costumer</label>
        <input id="cust" placeholder="Nama Costumer" autocomplete="off">
        <div class="row">
          <div>
            <label for="dOrder">Date Ordering</label>
            <input id="dOrder" type="date">
          </div>
          <div>
            <label for="dInv">Invoice Date</label>
            <input id="dInv" type="date">
          </div>
        </div>
        <label for="inv">No. Invoice</label>
        <input id="inv" autocomplete="off">
      </div>

      <!-- Daftar item -->
      <div class="card">
        <p class="hint">Tahan ikon ⠿ lalu geser untuk mengubah urutan item.</p>
        <div id="items"></div>
        <button class="add" id="addBtn" type="button">+ Tambah Item</button>
      </div>

      <!-- DP -->
      <div class="card">
        <label for="dp">DP (Rp) — kosongkan jika belum ada</label>
        <input id="dp" type="number" inputmode="numeric" placeholder="0">
      </div>

      <!-- Ringkasan -->
      <div class="card sum">
        <div><span>Grand Total</span><b id="sTotal">Rp.0</b></div>
        <div><span>DP</span><b id="sDp">Rp.0</b></div>
        <div class="t"><span>Sisa Pembayaran</span><span id="sSisa">Rp.0</span></div>
      </div>

      <button class="go" id="go" type="button">Buat &amp; Download PDF</button>
      <div id="abisMsg"></div>

      <!-- Riwayat -->
      <div class="card">
        <div class="hh"><b>Riwayat Nota</b><span id="hCount"></span></div>
        <input id="hSearch" placeholder="Cari nama atau no. invoice" autocomplete="off">
        <div id="hList"></div>
      </div>

      <!-- Pengaturan data -->
      <div class="card">
        <b>Pengaturan Data</b>
        <p class="hint" style="margin-top:6px">Riwayat tersimpan di browser HP ini saja. Hapus kalau sudah tidak diperlukan.</p>
        <button class="warn" id="clrHist" type="button">Hapus Semua Riwayat</button>
        <button class="warn" id="clrAll" type="button">Reset Total (riwayat + nomor urut)</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>

  <!-- Footer situs -->
  <footer data-site-footer></footer>

  <!-- Library & asset PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/pdf-assets.js"></script>

  <!-- Script situs (header & footer) -->
  <script src="https://fixsarts.github.io/header/header.js"></script>
  <script src="https://fixsarts.github.io/footer/js/footer-config.js"></script>
  <script src="https://fixsarts.github.io/footer/js/footer.js"></script>

  <!-- Logika aplikasi -->
  <script src="js/app.js"></script>

  <!-- Music widget (floating) -->
  <script
    src="https://cdn.jsdelivr.net/gh/fixsarts/MusicWidgets@main/music-player.js?v=20261023"
    data-src="https://cdn.jsdelivr.net/gh/fixsarts/MusicWidgets@main/Assets/Musik/Ariana%20Grande%20-%20bye%20%5BAltare%20Remix%5D.mp3"
    data-title="bye"
    data-artist="Ariana Grande - Altare Remix"
    data-css="https://cdn.jsdelivr.net/gh/fixsarts/MusicWidgets@main/music-player.css?v=20261023"
    defer>
  </script>
</body>
</html>
